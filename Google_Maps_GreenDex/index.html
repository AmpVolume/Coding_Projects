<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenDex Maps Prototype</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #20352a;
      background: #f3f7f4;
    }

    header {
      padding: 16px 24px;
      background: #176b45;
      color: white;
    }

    header h1 {
      margin: 0 0 6px;
    }

    header p {
      margin: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: calc(100vh - 90px);
    }

    aside {
      padding: 20px;
      background: white;
      border-right: 1px solid #dce5de;
      overflow-y: auto;
    }

    input {
      width: 100%;
      padding: 11px;
      margin: 12px 0;
      border: 1px solid #bdcec2;
      border-radius: 8px;
      font-size: 15px;
    }

    .company-card {
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #dce5de;
      border-radius: 9px;
      cursor: pointer;
    }

    .company-card:hover {
      background: #edf6ef;
    }

    .company-card h3 {
      margin: 0 0 6px;
    }

    .company-card p {
      margin: 4px 0;
      font-size: 13px;
      color: #52665a;
    }

    #map {
      min-height: 600px;
      width: 100%;
    }

    #status {
      font-size: 13px;
      color: #52665a;
    }

    @media (max-width: 700px) {
      .layout {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: none;
      }

      #map {
        min-height: 450px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>GreenDex Maps</h1>
    <p>Company Location Prototype</p>
  </header>

  <div class="layout">
    <aside>
      <h2>Companies</h2>
      <p id="status">Loading sample companies...</p>

      <input
        id="search"
        type="search"
        placeholder="Search companies..."
        aria-label="Search companies"
      >

      <div id="company-list"></div>
    </aside>

    <div id="map"></div>
  </div>

  <script>
    let map;
    let infoWindow;
    let allCompanies = [];
    let markers = [];

    async function initMap() {
      const { getCompanies, getCompanyById } =
        await import("./src/companyService.js");

      map = new google.maps.Map(
        document.getElementById("map"),
        {
          center: { lat: 44.83, lng: -68.72 },
          zoom: 10,
          mapTypeControl: true,
          streetViewControl: true,
          fullscreenControl: true,
          zoomControl: true
        }
      );

      infoWindow = new google.maps.InfoWindow();

      allCompanies = await getCompanies();

      renderCompanies(allCompanies);
      renderMarkers(allCompanies, getCompanyById);

      document.getElementById("status").textContent =
        `${allCompanies.length} sample companies loaded`;
    }

    function renderMarkers(companies, getCompanyById) {
      markers.forEach((marker) => marker.setMap(null));
      markers = [];

      companies.forEach((company) => {
        if (
          !Number.isFinite(company.position?.lat) ||
          !Number.isFinite(company.position?.lng)
        ) {
          return;
        }

        const marker = new google.maps.Marker({
          map,
          position: company.position,
          title: company.name
        });

        marker.addListener("click", async () => {
          const selected = await getCompanyById(company.id);

          if (!selected) return;

          const content = document.createElement("div");
          const title = document.createElement("h3");
          const category = document.createElement("p");
          const address = document.createElement("p");
          const description = document.createElement("p");

          title.textContent = selected.name;
          category.textContent = `Category: ${selected.category}`;
          address.textContent = `Address: ${selected.address}`;
          description.textContent = selected.description;

          content.append(title, category, address, description);

          infoWindow.setContent(content);
          infoWindow.open({ map, anchor: marker });
        });

        markers.push(marker);
      });
    }

    function renderCompanies(companies) {
      const list = document.getElementById("company-list");
      list.replaceChildren();

      companies.forEach((company) => {
        const card = document.createElement("div");
        card.className = "company-card";
        card.tabIndex = 0;

        const title = document.createElement("h3");
        title.textContent = company.name;

        const category = document.createElement("p");
        category.textContent = company.category;

        const address = document.createElement("p");
        address.textContent = company.address;

        card.append(title, category, address);

        const selectCompany = () => {
          map.panTo(company.position);
          map.setZoom(15);

          const marker = markers.find(
            (item) => item.getTitle() === company.name
          );

          if (marker) {
            google.maps.event.trigger(marker, "click");
          }
        };

        card.addEventListener("click", selectCompany);

        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectCompany();
          }
        });

        list.appendChild(card);
      });
    }

    document.getElementById("search").addEventListener("input", (event) => {
      const query = event.target.value.trim().toLowerCase();

      const filtered = allCompanies.filter((company) =>
        [
          company.name,
          company.category,
          company.address
        ].some((value) => value.toLowerCase().includes(query))
      );

      renderCompanies(filtered);
      renderMarkers(filtered, async (id) =>
        allCompanies.find((company) => company.id === Number(id)) ?? null
      );

      document.getElementById("status").textContent =
        `${filtered.length} of ${allCompanies.length} companies shown`;
    });

    window.initMap = initMap;
  </script>

  <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAaC2lLDZedStm4gK0hwYqKmgEY91N3zjk&callback=initMap">
  </script>
</body>
</html>
